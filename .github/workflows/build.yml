name: Build Layers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      distro:
        description: 'Comma separated distro filter (empty = all)'
        required: false
        default: ''
      layer:
        description: 'Comma separated layer filter (empty = all)'
        required: false
        default: ''
      arch:
        description: 'Comma separated arch filter: amd64,arm64 (empty = both)'
        required: false
        default: ''
      push:
        description: 'Push images to the registry'
        type: boolean
        required: false
        default: true
      parallel:
        description: 'Build jobs to run at once (1-10); the org shares 20 runner slots'
        type: number
        required: false
        default: 4

env:
  LAYERS_IMAGE: ghcr.io/linuxserver-playground/selkies-layers
  RUNNER_AMD64: ubuntu-24.04
  RUNNER_ARM64: ubuntu-24.04-arm

# One publishing run at a time, whatever started it (push, schedule or dispatch), so two runs never add up
# their build jobs; a newer one waits. Pull requests have a group each and cancel their older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
      manifests: ${{ steps.matrix.outputs.manifests }}
      push: ${{ steps.push.outputs.push }}
      parallel: ${{ steps.parallel.outputs.parallel }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to push
        id: push
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push }}" != "true" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide how many build jobs run at once
        id: parallel
        env:
          PARALLEL: ${{ inputs.parallel }}
        run: |
          # Push, schedule and pull request runs have no inputs and take the default. Clamped to 1-10 so a
          # run always leaves the image builds at least half of the org's 20 runner slots.
          p="${PARALLEL:-4}"
          [[ "${p}" =~ ^[0-9]+$ ]] || { echo "::error::parallel must be a whole number, got '${p}'"; exit 1; }
          (( p < 1 )) && p=1
          (( p > 10 )) && p=10
          echo "parallel=${p}" >> "$GITHUB_OUTPUT"

      - name: Generate matrix
        id: matrix
        run: |
          python3 scripts/matrix.py --github \
            --distro "${{ inputs.distro }}" \
            --layer "${{ inputs.layer }}" \
            --arch "${{ inputs.arch }}"

      - name: Summary
        env:
          BUILDS: ${{ steps.matrix.outputs.builds }}
          PUSH: ${{ steps.push.outputs.push }}
          PARALLEL: ${{ steps.parallel.outputs.parallel }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          print("## Build matrix\n")
          print(f"Push: `{os.environ['PUSH']}`, {os.environ['PARALLEL']} build jobs at a time\n")
          print("| Job | Dockerfile | Platform | Runner | Tag |")
          print("| --- | --- | --- | --- | --- |")
          for b in json.loads(os.environ["BUILDS"]):
              print(f"| {b['name']} | {b['dockerfile']} | {b['platform']} | {b['runner']} | `{b['tag']}` |")
          PY

  build:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The org's 20 concurrent job slots are shared with every image build: a full run is ~46 build jobs.
      max-parallel: ${{ fromJSON(needs.matrix.outputs.parallel) }}
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Log in to ghcr.io
        if: needs.matrix.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.tag }}
        env:
          BUILD_JSON: ${{ toJSON(matrix) }}
          PUSH: ${{ needs.matrix.outputs.push }}
        run: scripts/ci-build.sh

  manifest:
    name: Manifests
    needs:
      - matrix
      - build
    if: ${{ !cancelled() && needs.matrix.outputs.push == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Create the multi-arch manifests
        env:
          MANIFESTS_JSON: ${{ needs.matrix.outputs.manifests }}
        run: scripts/ci-manifests.sh
